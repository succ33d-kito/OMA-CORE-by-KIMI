name: 51R1 isolated Linux validation
on:
  push:
    branches: [validation/51r1-linux-ci-20261012]
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce installed versions from official PyPI
        run: |
          python -m pip install --index-url https://pypi.org/simple -r requirements.txt -c .github/51r1-validation-requirements.txt
          python -m pip install --index-url https://pypi.org/simple -r .github/51r1-validation-requirements.txt
          python --version
          python -m pip freeze
          uname -a
      - name: Compile new modules
        run: python -m py_compile core/scientific/price_role_h1_runner.py core/scientific/price_role_h1_runtime.py scripts/run_price_role_h1.py tests/test_price_role_h1_runner.py tests/test_price_role_h1_runtime.py tests/test_run_price_role_h1.py
      - name: Complete suite in network-isolated namespace
        shell: bash
        run: |
          set -o pipefail
          sudo unshare --net -- "$(which python)" -m pytest -q -rs -p no:cacheprovider --tb=short --junitxml="$RUNNER_TEMP/51r1-results.xml" 2>&1 | tee "$RUNNER_TEMP/51r1-pytest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 51r1-validation-results
          path: |
            ${{ runner.temp }}/51r1-results.xml
            ${{ runner.temp }}/51r1-pytest.log
